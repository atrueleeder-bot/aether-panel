name: Publish Aether Panel release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows-release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version agree
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }

      - name: Build managed NSIS release
        run: pnpm dist:win

      - name: Create GitHub release and publish updater artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
