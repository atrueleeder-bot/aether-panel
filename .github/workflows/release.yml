name: Publish Aether Panel release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows-release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version agree
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }

      - name: Build managed NSIS release
        run: pnpm dist:win -- --config.generateUpdatesFilesForAllChannels=true

      - name: Derive release metadata
        id: release_meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -match '^(?<base>\d+\.\d+\.\d+)-beta\.(?<number>\d+)$') {
            "release_name=Aether Panel $($Matches.base) Preview $($Matches.number)" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "release_name=Aether Panel $version" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub release and publish updater artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
